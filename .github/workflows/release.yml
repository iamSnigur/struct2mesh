name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  deployment:
    runs-on: ubuntu-latest
    environment: production
    steps:

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h
          
      - name: Get the sources
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve branch name
        id: branch
        run: |
          BASE="${{ github.event.base_ref }}"
          BRANCH="${BASE#refs/heads/}"
          echo "name=${BRANCH:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: src/minecraft.structure.loader/Library
          key: Library-${{ hashFiles('src/minecraft.structure.loader/Assets/**', 'src/minecraft.structure.loader/Packages/**', 'src/minecraft.structure.loader/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Build Struct2Mesh
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAME_CI_DOCKER_ENV: |
            GIT_BRANCH=${{ steps.branch.outputs.name }}
        with:
          projectPath: src/minecraft.structure.loader
          targetPlatform: WebGL
          buildsPath: artifacts
          versioning: Tag

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Struct2Mesh
          path: artifacts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy artifacts/WebGL/WebGL --project-name=struct2mesh --branch=dev
