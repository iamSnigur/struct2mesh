<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="author" content="struct2mesh.pages">
    <meta name="keywords" content="Minecraft, Structure, Viewer, Converter, Datapack, Resource Pack, Mesh, Model, 3D, NBT, Schem, Litematic, Mcstructure, Schematic, FBX, GLB, GLTF, OBJ, PLY">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://struct2mesh.pages.dev/">
    <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
    <meta property="og:description" content="Convert any Minecraft structure into a 3D model. Upload a structure file, view, and export.">
    <meta property="og:image" content="https://struct2mesh.pages.dev/TemplateData/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="Convert any Minecraft structure into a 3D model. Upload a structure file, view and export.">
    <meta name="twitter:image" content="https://struct2mesh.pages.dev/TemplateData/og.png">
  </head>
  <body style="overflow: hidden;">
    <div id="unity-container" style="width: 100%; height: 100%;">
      <canvas id="unity-canvas" width="auto" height="auto"></canvas>
      <div id="unity-warning"></div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }      

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}?v={{{ PRODUCT_VERSION }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                window.unityInstance = unityInstance;
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>

    <input type="file" id="fileInput" hidden />

    <div id="uploadOverlay">
      <div id="uploadPanel">
        <div id="dropZone">
          
          <div id="dropContent" class="drop-content">
            <div class="main">Drag & drop file here</div>
            <div class="sub">or click to browse</div>
            <div class="formats-content">
              <div class="format">.nbt</div>
            </div>
          </div>

          <div id="uploadContent">
            <div id="progressContainer">
              <div id="progressBar"></div>
            </div>
            <div id="fileInfo"></div>
          </div>
          
      </div>
    </div>
  </body>
</html>
