<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#292929">

    <title>{{{ PRODUCT_NAME }}} – Minecraft Structure to 3D Model Converter</title>
    <meta name="description" content="Convert Minecraft structures into 3D models. Upload a structure file, view and export.">
    <link rel="canonical" href="https://struct2mesh.pages.dev/">

    <meta name="author" content="@SNIGUR">
    <meta name="keywords" content="Minecraft, Structure, Viewer, Converter, Datapack, Resource Pack, Mesh, Model, 3D, NBT, Schem, Litematic, Mcstructure, Schematic, FBX, GLB, GLTF, OBJ, PLY">
    
    <link rel="icon" href="TemplateData/favicon.ico">

    <link rel="stylesheet" href="TemplateData/style.css">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{{ PRODUCT_NAME }}}">
    <meta property="og:url" content="https://struct2mesh.pages.dev/">
    <meta property="og:title" content="{{{ PRODUCT_NAME }}} - Minecraft Structure to 3D Model Converter">

    <meta property="og:description" content="Convert Minecraft structures into 3D models. Upload a structure file, view and export.">
    <meta property="og:image" content="https://struct2mesh.pages.dev/TemplateData/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Struct2Mesh logo with the tagline: Turn Minecraft structures into 3D models">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{{ PRODUCT_NAME }}} - Minecraft Structure to 3D Model Converter">
    <meta name="twitter:description" content="Convert Minecraft structures into 3D models. Upload a structure file, view and export.">
    <meta name="twitter:image" content="https://struct2mesh.pages.dev/TemplateData/og.png">
    <meta name="twitter:image:alt" content="Struct2Mesh logo with the tagline: Turn Minecraft structures into 3D models">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "{{{ PRODUCT_NAME }}}",
      "url": "https://struct2mesh.pages.dev/",
      "description": "Convert Minecraft structures into 3D models. Upload a structure file, view and export.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Any (web browser)",
      "image": "https://struct2mesh.pages.dev/TemplateData/og.png"
    }
    </script>
  </head>
  <body style="overflow: hidden;">
    <div id="unity-container" style="width: 100%; height: 100%;">
      <canvas id="unity-canvas" width="auto" height="auto"></canvas>
      <div id="unity-warning"></div>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }      

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}?v={{{ PRODUCT_VERSION }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}?v={{{ PRODUCT_VERSION }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } 
      else {

        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                window.unityInstance = unityInstance;
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);
    </script>

    <input type="file" id="fileInput" hidden />

    <div id="uploadOverlay">
      <div id="uploadPanel">
        <div id="dropZone">
          
          <div id="dropContent" class="drop-content">
            <div class="main">Drag & drop file here</div>
            <div class="sub">or click to browse</div>
            <div class="formats-content">
              <div class="format">.nbt</div>
            </div>
          </div>

          <div id="uploadContent">
            <div id="progressContainer">
              <div id="progressBar"></div>
            </div>
            <div id="fileInfo"></div>
          </div>
                    
        </div>
      </div>
    </div>
  </body>
</html>
